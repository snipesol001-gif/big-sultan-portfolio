<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BigSultan | Sultan of Africa</title>
    <meta
      name="description"
      content="Enter the world of BigSultan, the Sultan of Africa. Explore Web3 marketing, community growth, crypto alpha, and the trenches."
    />
    <meta name="theme-color" content="#F5F5F5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph for link previews. og:image becomes a full URL in Step 9
         once the live domain exists. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BigSultan | Sultan of Africa" />
    <meta
      property="og:description"
      content="Enter the world of BigSultan, the Sultan of Africa. Explore Web3 marketing, community growth, crypto alpha, and the trenches."
    />
    <meta property="og:image" content="/images/banner.webp" />

    <!-- Large image card when the link is shared on X -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts, loaded without blocking the first paint. Only the
         weights the site uses: Cinzel Decorative 700 and 900, Poppins 400,
         500, 600, 700. If you ever add a class like font-light or
         font-extrabold, add that weight back into both links below. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Poppins:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
